[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merps-low-mae-regression"
version = "1.0.0"
description = "Low-MAE EEG-fNIRS emotion regression with video-time priors"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
